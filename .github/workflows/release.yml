name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-and-release:
    runs-on: windows-latest
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Resolve release version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
              throw "发布标签格式无效：$tag。应使用 v<major>.<minor>.<patch>。"
          }

          "RELEASE_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore tests/GameTimeRecord.Tests/GameTimeRecord.Tests.csproj

      - name: Verify formatting
        run: dotnet format tests/GameTimeRecord.Tests/GameTimeRecord.Tests.csproj --verify-no-changes --no-restore

      - name: Test
        run: dotnet test tests/GameTimeRecord.Tests/GameTimeRecord.Tests.csproj -c Release --no-restore "-p:Version=$env:RELEASE_VERSION"

      - name: Publish Windows portable package
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Version $env:RELEASE_VERSION

      - name: Create checksum
        shell: pwsh
        run: |
          $archive = Resolve-Path 'artifacts/GameTimeRecord-win-x64.zip'
          $checksum = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $([IO.Path]::GetFileName($archive))" |
              Set-Content 'artifacts/GameTimeRecord-win-x64.zip.sha256' -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notes)) {
              throw "缺少发布说明：$notes"
          }

          gh release create $tag `
              'artifacts/GameTimeRecord-win-x64.zip' `
              'artifacts/GameTimeRecord-win-x64.zip.sha256' `
              --verify-tag `
              --title "GameTimeRecord $tag" `
              --notes-file $notes
